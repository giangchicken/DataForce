name: tool_decision
version: "1"
modality: text2text

# The question template, by name under `config/prompts/`. Read at the edge and handed
# to the profile, because no engine module opens a file -- `edge/bootstrap.py` (T27) is
# what resolves this name. The template names no slot: one question is asked per record
# and the record's own specifics reach the annotator as task data, so a `{{...}}` in the
# file is refused at composition rather than shown to a person.
prompts:
  question: profiles/tool_decision/question.v2

# The cardinality ceiling: at most this many calls in one answer. `answer_schema`
# materialises it as `maxItems` and `label_cardinality_anomaly` reads the same number,
# so the check and the space an answer is validated against cannot disagree.
#
# Provisional. Two, because the declared input shape's own sample calls one tool and a
# request that needs two -- send the statement *and* open a ticket -- is the ordinary
# next case, while three would make the check silent on a source nobody has measured.
# What re-measures it: the distribution of `len(label)` over a declared corpus, which
# the first run reports and `params.invalid_counts.label_cardinality_anomaly` then pins.
max_calls: 2

# Which control captures the answer. Declared rather than detected, because it changes
# what an annotator can physically express and therefore what their agreement means.
# Which one this project shipped is stamped from here, so a measured agreement figure
# can be read against the surface it was measured on.
#
#   names_and_json_arguments  a name control over this record's catalog, plus one text
#                             field holding the chosen calls' arguments as JSON
#   json_text                 one text field; the annotator writes the whole answer
#   per_name_arguments        a name control plus each chosen tool's own argument
#                             fields, rendered per tool
#
# `per_name_arguments` is the one we would want and cannot have: a Label Studio project
# holds one labelling config for every task in it, and our catalog is per record, so
# per-tool argument fields cannot be expressed. `names_and_json_arguments` is what
# § *The annotation config, and what comes back* specifies -- names come from a dynamic
# choice list so they cannot be mistyped, which is the half δ weights first, and only
# the arguments are typed by hand.
answer_control: names_and_json_arguments

# How a source item is read. One shape is declared (Requirement 13): standard
# OpenAI chat-completion records carrying the tool catalog as `tools` data. A record
# with no `tools` key is an empty catalog, which is a quarantine for triage -- never a
# reason to parse a catalog out of the prose. The previous value here declared a
# retired corpus's shape, where the catalog *was* prose in the system turn, which made
# this profile read a declared-input record as an empty catalog.
shape: openai_chat_completion

# Which turn states the answer a second time, in this source's own vocabulary.
# `label_assistant_mismatch` reads it and nothing else does: `instruction` and
# `conversation` were declared here too and had no reader, because every turn is context
# and the display half, the jury slots and the vector all take all of them. A list is
# permitted and its first entry is used, since `roles` in this shape may name several.
roles:
  target: assistant

# Which key inside the source's `meta` holds the answer (Requirement 14). Declared, so a
# source calling it `target` or `gold` needs this line and no code.
label:
  at: label

# Which source key marks a record a person has already checked. No reader yet: the
# pilot's gold accuracy is T31, and this is the line it will read. A five-entry `meta:`
# rename map sat beside this and was deleted -- Requirement 9 keeps `meta` verbatim, so a
# map from our names to the source's has no future reader either, and the names in it were
# the retired corpus's.
gold:
  from: human_checked
