# The `text2text` modality's identity and the two choices that decide what its
# vectors mean.
#
# The filename is the identity (Requirement 40): this file is `text2text.yaml`, so
# the pair is `text2text`, and `name` below must agree. `version` is stamped into
# every record's provenance, so it is a reviewed line rather than a class attribute
# someone edits in passing -- and it is a string.
name: text2text
version: "1"

embedding:
  # Static embeddings, so a vector is a pure function of its input and two runs over
  # one corpus dedup identically (Requirement 23).
  model: minishlab/potion-multilingual-128M
  # Roles left out of the vector. Provisional. The measurement that chose this was
  # taken on a corpus that is no longer declared, where the tool catalog arrived as a
  # ~4,000-character instruction block in the system turn and swamped a ~780-character
  # conversation. The input shape this spec declares carries the catalog as `tools`
  # data (Requirement 13), so that system turn no longer exists in the form the
  # measurement was about. The setting is kept because excluding an instruction turn
  # from a content vector is defensible on its own; the number behind it is not
  # inherited. What re-measures it: retrieval of known near-duplicate pairs, with and
  # without the system role, over a declared corpus.
  exclude_roles: [system]

# Layer one's language and this corpus's two lengths. The pattern *shapes* stay in
# `utils.py` -- a regular expression is tested, and those six are tested against
# adversarial fixtures (spec.md § *Testing Strategy* item 6). What a corpus decides
# is here: the words its speakers dictate with, and how long a run has to be before
# it is a candidate. A modality provides the framework for a task family and may not
# also decide the family's language, which is what these lines are for.
personal_data:
  spoken:
    # Every word this corpus says a digit with. `mốt`, `tư` and `lăm` are the spoken
    # variants of one, four and five, which is why this is a set and not ten entries.
    # Each entry must be alphanumeric: they are written into a regular expression, so
    # a `.` here would be read as syntax and `re` would still compile it.
    digits: [không, một, mốt, hai, ba, bốn, tư, năm, lăm, sáu, bảy, tám, chín]
    # The word for the digit a phone number is dictated from.
    zero: không
    # `@` and `.`, said aloud. Joined on whitespace when built, so `a  còng` matches.
    at: a còng
    dot: chấm
  # Six digits is the shortest identifier this corpus's sample carries (`480215`).
  # Raising it drops short ids from layer one; lowering it makes every price a hit.
  identifier_digits: 6
  phone:
    # The national trunk prefix, written. A Vietnamese mobile number is this and nine
    # more digits.
    prefix: "0"
    # Total digits, and total dictated words, shortest first. **These two disagree by
    # one and that is inherited, not chosen**: before these lines existed the written
    # pattern matched ten or eleven digits and the spoken one nine or ten words.
    # Declaring them preserved both, because moving a literal must not move a
    # boundary -- a detector's reach decides what gets redacted. What settles it is a
    # measurement of layer one's recall over a declared corpus.
    written_digits: [10, 11]
    spoken_words: [9, 10]
