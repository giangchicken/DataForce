# The `text2text` modality's identity and the two choices that decide what its
# vectors mean.
#
# The filename is the identity (Requirement 40): this file is `text2text.yaml`, so
# the pair is `text2text`, and `name` below must agree. `version` is stamped into
# every record's provenance, so it is a reviewed line rather than a class attribute
# someone edits in passing -- and it is a string.
name: text2text
version: "1"

embedding:
  # The name this deployment serves its bi-encoder under, resolved to an endpoint by
  # `config/model/<model>.json`, which is attached rather than committed. Multilingual
  # and a better embedder over Vietnamese than a distilled static model, and already
  # running -- so no run downloads weights. What Requirement 23 can still promise is
  # this name: a run manifest records which model produced its groups, and cannot say
  # which weights answered to it.
  model: bge-m3
  # Roles left out of the vector. Provisional. The measurement that chose this was
  # taken on a corpus that is no longer declared, where the tool catalog arrived as a
  # ~4,000-character instruction block in the system turn and swamped a ~780-character
  # conversation. The input shape this spec declares carries the catalog as `tools`
  # data (Requirement 13), so that system turn no longer exists in the form the
  # measurement was about, and it was taken against a static model this deployment no
  # longer runs. The setting is kept because excluding an instruction turn from a
  # content vector is defensible on its own; the number behind it is not inherited.
  # What re-measures it: retrieval of known near-duplicate pairs, with and without the
  # system role, over a declared corpus and through the embedder above.
  exclude_roles: [system]


# Which language layer one's patterns are filled with. One word, because the words a
# language dictates digits with do not vary between two corpora of it -- the shapes
# are `utils.py`'s and the table behind this name is `spoken_forms`, which is where a
# second language is added. `vi` and `en` are written down today; a name nobody has
# written down is a ConfigError rather than a silent fallback, because scanning a
# Spanish corpus with Vietnamese digit words finds nothing and finding nothing looks
# exactly like a clean corpus.
language: vi
