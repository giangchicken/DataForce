# The `text` modality's identity and the two choices that decide what its vectors mean.
#
# Declared for the same reason the profile's is: `producer.modality` stamps `text@1`
# onto every record, so the version has to be a reviewed line rather than a class
# attribute someone edits in passing.
name: text
version: "1"

embedding:
  # Static embeddings, so a vector is a pure function of its input and two runs over
  # one corpus dedup identically.
  model: minishlab/potion-multilingual-128M
  # Roles left out of the vector. Measured on 200 real duplicate pairs: retrieving a
  # record's near-duplicate succeeds 200/200 on the conversation alone and 0/200 with
  # the system turn included, because a 4,000-character instruction block swamps a
  # 780-character conversation. Catalog similarity is what `group_key` measures.
  exclude_roles: [system]
