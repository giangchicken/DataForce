[project]
name = "dataforce"
version = "0.1.0"
description = "Turns a raw, model-labelled corpus into a training-ready dataset plus the evidence for trusting it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # Pinned to a git tag because the library is on no registry. `uv.lock` records
    # the commit the tag resolves to, so a moved tag shows up as a lockfile diff
    # rather than as a release built from a tree nobody chose -- which matters,
    # because this tag has already been moved once.
    "agent-toolkit[llm] @ git+https://github.com/giangchicken/agent-toolkit.git@v0.1.0",
    # The embeddings call `duplicate_check` groups through. `agent-toolkit` owns the
    # LLM client but exposes nothing embedding-shaped -- `complete`, `complete_structured`,
    # `complete_with_reasoning`, `count_tokens` and the resolvers, and no `embed` -- so
    # there is no front door to go through and the edge posts to the deployment's own
    # endpoint. It arrives transitively through `agent-toolkit[llm]` anyway; declared here
    # because `src/` imports it, under one annotated I6 exemption in `edge/bootstrap.py`
    # that the library task deletes when an `embed` lands beside `complete`.
    "openai>=3.2",
    "pydantic>=2.13",
    # Requirement 49: a corrected value an annotator typed by hand either validates
    # against that record's own `answer_schema` or is `None`. `agent-toolkit` owns
    # validation and exposes it only inside `complete_structured`, which needs a model
    # call -- and a hand-written twin of a schema we materialise ourselves is the pair
    # of definitions I6 exists to prevent. It arrives transitively through
    # `agent-toolkit[llm]` anyway; declared here because `src/` imports it, under one
    # annotated I6 exemption in `profiles/tool_decision/utils.py`.
    "jsonschema>=4.26",
    # The question store's engine (Decision 6: `publish` writes to a database we own).
    # Pinned inside 2.0 because the models are written in its declarative style and 2.1
    # is where that changes; SQLite and Postgres are one adapter with two DSNs, not two
    # adapters, which is the whole of why one dependency covers both (Decision 7).
    "sqlalchemy>=2.0.52,<2.1",
    # Migrations. A store whose schema is applied by `create_all` has no way to change
    # one, and the pilot changes one: `alembic upgrade head` against an empty database
    # is what T23 asserts, so the first schema is a migration rather than a side effect
    # of importing the models.
    "alembic>=1.19.1",
]

[project.scripts]
dataforce = "dataforce.edge.cli:main"

[project.optional-dependencies]
# Only the sync imports this, and only inside the function that builds a client -- so the
# pipeline installs and `make check` runs with no annotation tool anywhere (Decision 6).
# An install without the extra fails at `POST /human-review/publish/sync` and nowhere else.
label-studio = [
    "label-studio-sdk>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The library is a direct git reference; hatchling refuses one unless told.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dataforce"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0.0",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
# Specs and plans quote a code surface that does not all exist yet; reformatting
# their fenced blocks would misquote them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the network or a service; excluded from `make check`",
]
