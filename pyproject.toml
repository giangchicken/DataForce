[project]
name = "dataforce"
version = "0.1.0"
description = "Turns a raw, model-labelled corpus into a training-ready dataset plus the evidence for trusting it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # A branch, not a tag: the library is on no registry and `embed` has not shipped
    # under one yet. `uv.lock` records the commit either way, so a run is still built
    # from one tree. Back to a tag at release.
    "agent-toolkit[llm] @ git+https://github.com/giangchicken/agent-toolkit.git@dev",
    # Not imported by `src/` any more -- `agent_toolkit.embed` owns the socket. Declared
    # for the floor: the library asks for `>=2.0` and is written against the 3.x line,
    # so without this uv may resolve a major it is not tested on.
    "openai>=3.2",
    "pydantic>=2.13",
    # Requirement 49: a corrected value an annotator typed by hand either validates
    # against that record's own `answer_schema` or is `None`. `agent-toolkit` owns
    # validation and exposes it only inside `complete_structured`, which needs a model
    # call -- and a hand-written twin of a schema we materialise ourselves is the pair
    # of definitions I6 exists to prevent. It arrives transitively through
    # `agent-toolkit[llm]` anyway; declared here because `src/` imports it, under one
    # annotated I6 exemption in `profiles/tool_decision/answers.py`.
    "jsonschema>=4.26",
    # The question store's engine (§ *The question store*: `publish` writes to a
    # database we own).
    # Pinned inside 2.0 because the models are written in its declarative style and 2.1
    # is where that changes; SQLite and Postgres are one adapter with two DSNs, not two
    # adapters, which is the whole of why one dependency covers both.
    "sqlalchemy>=2.0.52,<2.1",
    # Migrations. A store whose schema is applied by `create_all` has no way to change
    # one, and the pilot changes one: `alembic upgrade head` against an empty database
    # is what T23 asserts, so the first schema is a migration rather than a side effect
    # of importing the models.
    "alembic>=1.19.1",
    # The HTTP shell. One of the two ways every service is driven (Requirement 46), and
    # the style reference's `create_app()` factory is written against its `APIRouter`.
    "fastapi>=0.141.1",
    # What serves that app. Named as a dependency rather than left to a deployment
    # because `edge/main.py` is only half a shell without something to run it.
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
# Only the sync imports this, and only inside the function that builds a client -- so the
# pipeline installs and `make check` runs with no annotation tool anywhere
# (§ *The question store*).
# An install without the extra fails at `POST /human-review/publish/sync` and nowhere else.
label-studio = [
    "label-studio-sdk>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The library is a direct git reference; hatchling refuses one unless told.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Every file under the directory ships, not only the `.py` ones, which is how
# `py.typed` and `edge/static/index.html` reach an install without being named here.
packages = ["src/dataforce"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    # What `fastapi.testclient` is built on. A test dependency and not a runtime one:
    # nothing in `src/` imports it, and I15 is the only thing that drives the app.
    "httpx>=0.28",
    # Here as well as in the `[label-studio]` extra, and the two are different jobs.
    # The extra is what a *deployment* opts into to run the sync. This is what
    # `mypy --strict` needs to see: `edge/label_studio.py` has one line that touches
    # the SDK's constructor, and with the library absent that line is an
    # `import-not-found` and its annotation an unused ignore -- so `make check` would
    # pass or fail depending on which install ran it, which is the one thing the
    # commit gate may not do.
    "label-studio-sdk>=2.1.1",
    "pytest>=8.0.0",
    # Every stage is a coroutine since the pipeline went async, so a test that runs one
    # needs a loop. `auto` rather than a decorator per test: there is no sync stage left.
    "pytest-asyncio>=0.24.0",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
# Specs and plans quote a code surface that does not all exist yet; reformatting
# their fenced blocks would misquote them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
# PEP 561: without the marker `dataforce` is an untyped install to its own type
# checker, so every intra-package import resolves to `Any` and a finding inside one
# is invisible. `mypy_path` plus explicit bases is the other half: the editable
# install puts `src/` on the path, so without them one file is reachable under two
# module names and mypy refuses.
mypy_path = "src"
explicit_package_bases = true

# `agent_toolkit` ships no marker either, but it is annotated -- `complete`,
# `resolve_config` and the rule scans all carry full signatures -- so following the
# import reads them. `ignore_missing_imports` would make the library's whole surface
# `Any` instead, which is how a signature changing under a pinned branch becomes
# invisible here.
[[tool.mypy.overrides]]
module = "agent_toolkit.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs the network or a service; excluded from `make check`",
]
