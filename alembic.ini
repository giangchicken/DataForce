# Alembic's configuration, and deliberately three lines of it.
#
# There is no `sqlalchemy.url`. The DSN is read once, from `DATAFORCE_DATABASE_URL`
# through `edge/store/session.py`, and a second copy here would be the one that
# is wrong -- the placeholder Alembic generates is also a credential-shaped line in a
# public repository, which AGENTS.md section 9 forbids on sight.
#
# There is no logging configuration either. `edge/observability.py` owns the handler
# and the keys every event carries; a second logging setup in an ini file is a
# second answer to one question, and `migrations/env.py` therefore configures none.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# How the line above is split. Declared, because the fallback is deprecated and warns.
path_separator = os
