# Every threshold the pipeline reads at runtime. A number here is a decision that is
# committed, reviewable, and recorded by digest in the run manifest -- so a change to
# it is attributable and a run that used the old value is still identifiable. Code
# holds no thresholds.
#
# No corpus is declared. Every value below that a corpus would supply is empty on
# purpose: the shape is the contract, and the first run over a declared source fills
# it. An empty key here is not an oversight, it is a question nobody has answered yet.

source:
  # Repo-relative. data/raw/ is not committed; the SHA-256 is the source's identity,
  # and `load_data` hard-stops when the file does not match it.
  path: ""
  sha256: ""

# False by default. False means pii_check reports and leaves content untouched, and
# the downstream personal-data scan then fails, so nothing ships. Turning it on is a
# change to this file, which makes the decision attributable.
enable_redact: false

# Expected count per label check, declared so a source change is a decision rather
# than a surprise. The five names are the profile's `label_checks()`, and they are
# listed with no values because the counts are a property of a corpus, not of the
# pipeline. The first run over a declared source populates them; from then on a count
# that has moved is a line a human reads in a diff (Requirement 22, Requirement 44).
invalid_counts:
  label_assistant_mismatch:
  label_not_in_catalog:
  empty_catalog:
  label_cardinality_anomaly:
  label_names_one_tool_twice:

thresholds:
  jury: {}          # panel floor, invalid-vote rate, estimated-token ceiling (T19)
  triage: {}        # bucket boundaries, stratum quotas, audit sizing (T21)
  pilot: {}         # alpha, flag rate, gold accuracy, bucket precision (T31)
