# Every threshold the pipeline reads at runtime. A number here is a decision that is
# committed, reviewable, and recorded by digest in the run manifest -- so a change to
# it is attributable and a run that used the old value is still identifiable. Code
# holds no thresholds.
#
# No corpus is declared. Every value below that a corpus would supply is empty on
# purpose: the shape is the contract, and the first run over a declared source fills
# it. An empty key here is not an oversight, it is a question nobody has answered yet.

source:
  # Repo-relative. data/raw/ is not committed; the SHA-256 is the source's identity,
  # and `load_data` hard-stops when the file does not match it.
  path: ""
  sha256: ""

# False by default. False means pii_check reports and leaves content untouched, and
# the downstream personal-data scan then fails, so nothing ships. Turning it on is a
# change to this file, which makes the decision attributable.
enable_redact: false

# Expected count per label check, declared so a source change is a decision rather
# than a surprise. The five names are the profile's `label_checks()`, and they are
# listed with no values because the counts are a property of a corpus, not of the
# pipeline. The first run over a declared source populates them; from then on a count
# that has moved is a line a human reads in a diff (Requirement 22, Requirement 44).
invalid_counts:
  label_assistant_mismatch:
  label_not_in_catalog:
  empty_catalog:
  label_cardinality_anomaly:
  label_names_one_tool_twice:

thresholds:
  # Empty and reads as empty: `jury` holds no threshold. A panel floor and an invalid-vote
  # rate were sketched here before Decision 10 deleted the gates, and a number nothing reads
  # is a number that goes stale unnoticed -- `invalid_votes` and the vote count are on every
  # record, and comparing them to anything is a line in metrics.json (Requirement 44). Kept as
  # a declared key so the question is visible rather than forgotten.
  jury: {}

  pilot: {}         # alpha, flag rate, gold accuracy, bucket precision (T31)

  # How many people must have answered before a verdict is folded out of them. `aggregate`
  # skips a record with fewer and it keeps its answers, so raising this does not lose one.
  #
  # It is the same number as the annotation project's `maximum_annotations`, and the two
  # cannot be allowed to drift: a project collecting one answer and a floor of two would
  # produce a corpus where nothing is ever aggregated, and nothing would say why. Smoke is
  # 1 and Pilot is 2 -- this is Smoke's, and the pilot's re-tuning pass moves it with the
  # project setting in the same commit.
  aggregate:
    overlap_floor: 1

  # Two floors and one row per cell they make. Every value here is provisional: `objective.md`
  # §8 calls bucket thresholds provisional until the pilot measures them, and `triage` gets
  # exactly one re-tuning pass afterwards. What re-measures them is the pilot's own question --
  # does each bucket predict what humans find -- and a bucket whose precision the pilot cannot
  # establish gets `quota: 0`, which is how a bucket is retired without deleting its row.
  #
  # A quota is a share of the bucket, applied per record from a digest of its `record_id`, so
  # two runs over one corpus select the same records and a re-tuning pass does not churn the
  # audit sample.
  triage:
    # Agreement is `1 - δ`, so 0.7 is "mostly the same answer". Below the first floor the
    # jurors do not agree with each other; below the second they do not agree with the label.
    # Note what 0.7 costs on a panel of three: two jurors of three agreeing with the label is
    # 0.667 and reads as no agreement, so a 2-of-3 majority lands in `contested` and goes to a
    # person. That is the conservative side to be provisionally wrong on, and it is the first
    # thing the pilot's bucket precision will argue about.
    self_agreement_floor: 0.7
    label_agreement_floor: 0.7
    buckets:
      # Both floors met: the panel and the label say the same thing. Sampled, not reviewed --
      # this is the audit sample the unvalidated remainder's error bar is estimated from.
      confirmed: { stratum: audit, quota: 0.05 }
      # The jurors agree with each other and against the label. The highest-value review there
      # is, so all of it goes to a person.
      disputed: { stratum: flagged, quota: 1.0 }
      # The jurors split and lean toward the label.
      divided: { stratum: flagged, quota: 1.0 }
      # Neither floor met, which is also where a record with no usable votes lands: `cohesion`
      # scores absent evidence as 0.0, so a panel that failed and a panel of one arrive here.
      contested: { stratum: flagged, quota: 1.0 }

  # The one threshold with a value, because a similarity has no defensible default: 0 groups
  # every record with every other and 1 groups nothing, so `duplicate_check` refuses to guess
  # and reads this. Provisional again, and for a new reason: 0.95 was chosen against a static
  # model's similarity distribution, and `embedding.model` is now `bge-m3` on this
  # deployment's own endpoint. A bi-encoder's cosines are not that model's cosines, so the
  # number does not carry across and is a placeholder until it is measured.
  # What re-measures it: the distribution of pairwise cosine *within one scenario* over a
  # declared corpus, through the model the modality manifest names, which the first run reports.
  duplicate_check:
    near_duplicate_cosine: 0.95
