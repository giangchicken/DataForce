# Every threshold the pipeline reads at runtime. A number here is a decision that
# is committed, reviewable, and a declared DVC dependency -- so changing it
# re-runs the stages that depend on it. Code holds no thresholds.

source:
  # Repo-relative. data/raw/ is not DVC-tracked and not committed; the SHA-256 is
  # the source's identity, and `load` hard-stops when the file does not match it.
  path: data/raw/fc_train_final.json
  sha256: 0899b9ce88c2d2b4d3f6cad1bb9f2fcb7fc20e3016e21adafd37cd4e5282f0ec

# False by default. False means pii_check reports and leaves content untouched,
# and the downstream personal-data scan then fails, so nothing ships. Turning it
# on is a change to this file, which makes the decision attributable.
enable_redact: false

# Expected count per validity check, declared so a source change is a decision
# rather than a surprise. Populated from the adapter's own run over the declared
# source. Two read 0 because the adapter's name convention resolves every name the
# corpus uses: the 841 and 722 in the profile spec are what a stricter name pattern
# reports about names carrying a dot, hyphen, space or tab. A check reading 0 is
# what tells you when it stops reading 0.
invalid_counts:
  label_assistant_mismatch: 0
  label_not_in_catalog: 0
  empty_catalog: 0
  label_cardinality_anomaly: 0

# The gold set, declared as a count so it drifts loudly. The profile manifest's
# `gold.from` says which field identifies it; this says how many records it selects.
gold:
  records: 951

# The largest answer this source contains. A record above it means a catalog or a
# parser change inflated answer size, which is a decision rather than data.
max_answer_cardinality: 3

thresholds:
  jury: {}          # panel floor, invalid-vote rate, estimated-token ceiling (T18)
  triage: {}        # bucket boundaries, stratum quotas, audit sizing (T20)
  pilot: {}         # alpha, flag rate, gold accuracy, bucket precision (T25)
