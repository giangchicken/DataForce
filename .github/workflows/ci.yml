name: ci

# Two jobs, because the two suites need different things. `make check` needs the tree and
# nothing else, so it is the gate every commit passes. `make integration` needs a database
# and an annotation tool, which a public runner has only where a deployment attached them.

on: [push, pull_request]

jobs:
  check:
    # The commit gate: ruff, `mypy --strict`, pytest without `-m integration`. It makes no
    # network call and reads no credential, which is what lets it be the signal everyone reads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: make check

  integration:
    # The slow half: the store against a real Postgres, the sync against a real Label Studio.
    # The addresses are the environment's, the way `store/session.py` and `label_studio.py`
    # read them, and the step is skipped where none is declared -- *not run* and *passed* are
    # different claims, and a job that runs a suite which skips itself makes them one.
    runs-on: ubuntu-latest
    env:
      DATAFORCE_TEST_DATABASE_URL: ${{ secrets.DATAFORCE_TEST_DATABASE_URL }}
      DATAFORCE_LABEL_STUDIO_URL: ${{ secrets.DATAFORCE_LABEL_STUDIO_URL }}
      DATAFORCE_LABEL_STUDIO_API_KEY: ${{ secrets.DATAFORCE_LABEL_STUDIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: the store and the sync, against the services a deployment attached
        if: env.DATAFORCE_TEST_DATABASE_URL != '' || env.DATAFORCE_LABEL_STUDIO_URL != ''
        run: make integration
